baseURL = 'https://Ha123CPU.github.io/boke/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh-cn'
title = '我的 Hugo 博客'
theme = 'even'

# 自动识别中文、日文、韩文
hasCJKLanguage = true

# 每页文章数
paginate = 5

# 作者信息
[author]
  name = 'Ha123CPU'

# 站点地图
[sitemap]
  changefreq = 'weekly'
  priority = 0.5
  filename = 'sitemap.xml'

# 语法高亮
pygmentsOptions = 'linenos=table'
pygmentsCodefences = true
pygmentsUseClasses = true
pygmentsCodefencesGuessSyntax = true

# 菜单
[[menu.main]]
  name = '首页'
  weight = 10
  identifier = 'home'
  url = '/'
[[menu.main]]
  name = '归档'
  weight = 20
  identifier = 'archives'
  url = '/post/'
[[menu.main]]
  name = '标签'
  weight = 30
  identifier = 'tags'
  url = '/tags/'
[[menu.main]]
  name = '分类'
  weight = 40
  identifier = 'categories'
  url = '/categories/'

# 主题参数
[params]
  version = '4.x'
  debug = false
  since = '2026'
  logoTitle = '我的博客'
  keywords = ['Hugo', '博客', '技术']
  description = '我的 Hugo 博客'
  archivePaginate = 50
  dateFormatToUse = '2006-01-02'
  toc = true
  autoCollapseToc = false
  fancybox = true
  postMetaInFooter = true
  uglyURLs = false
  showLanguageSelector = false

# 隐私
[privacy]
  [privacy.googleAnalytics]
    anonymizeIP = true
  [privacy.youtube]
    privacyEnhanced = true

# 标记渲染
[markup]
  [markup.tableOfContents]
    startLevel = 1
  [markup.goldmark.renderer]
    unsafe = true
